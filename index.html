<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>OpenCharts</title>
    <meta name="description" content="Free, open-source candlestick charting app." />
    <meta property="og:title" content="OpenCharts" />
    <meta property="og:description" content="Free, open-source candlestick charting app." />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="alert-toast" class="alert-toast" hidden role="status"></div>
      <div id="workspace">
      <header class="toolbar">
        <div class="brand" title="OpenCharts">OpenCharts</div>

        <label class="field">
          <span>Exchange</span>
          <select id="source" data-source></select>
        </label>

        <label class="field field-pair">
          <span>Pair</span>
          <button type="button" id="pair-btn" title="Search symbol (start typing)">XRP/USD</button>
          <select id="pair" data-pair class="visually-hidden" tabindex="-1" aria-hidden="true"></select>
        </label>

        <div class="group" role="group" aria-label="Interval" id="intervals"></div>
        <div class="group" id="layout-btns" role="group" aria-label="Chart layout">
          <button type="button" data-panes="1" class="is-active" title="One chart">1</button>
          <button type="button" data-panes="2" title="Two charts">2</button>
          <button type="button" data-panes="4" title="Four charts">4</button>
        </div>
        <button type="button" id="ind-btn" title="Indicators">fx Indicators</button>
        <div class="compare-wrap">
          <button type="button" id="compare-btn" title="Compare symbols in percent" aria-expanded="false" aria-controls="compare-pop">Compare</button>
          <div id="compare-pop" hidden>
            <input type="text" id="compare-search" placeholder="Add symbol" aria-label="Add symbol to compare" autocomplete="off" />
            <div id="compare-results" class="compare-results"></div>
            <div id="compare-list" class="compare-list"></div>
          </div>
        </div>
        <button type="button" id="sidebar-btn" aria-pressed="true" title="Watchlist and alerts panel">Panel</button>
        <button type="button" id="theme-btn" title="Switch light/dark theme">Light theme</button>
        <div class="settings-wrap">
          <button type="button" id="settings-btn" title="Settings" aria-label="Settings" aria-haspopup="menu" aria-expanded="false" aria-controls="settings-menu">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M6.5 1.2h3l.35 1.7c.42.16.81.39 1.16.67l1.65-.7 1.5 2.6-1.35 1.15c.08.4.12.8.12 1.22s-.04.82-.12 1.22l1.35 1.15-1.5 2.6-1.65-.7a5.3 5.3 0 0 1-1.16.67L9.5 14.8h-3l-.35-1.7a5.3 5.3 0 0 1-1.16-.67l-1.65.7-1.5-2.6 1.35-1.15A5.4 5.4 0 0 1 3 8.94c0-.42.04-.82.12-1.22L1.77 6.57l1.5-2.6 1.65.7c.35-.28.74-.51 1.16-.67L6.5 1.2ZM8 6.4A1.6 1.6 0 1 0 8 9.6 1.6 1.6 0 0 0 8 6.4Z"/></svg>
            Settings
          </button>
          <div id="settings-menu" hidden role="menu" aria-labelledby="settings-btn">
            <button type="button" role="menuitem" id="settings-export">Export data</button>
            <button type="button" role="menuitem" id="settings-import">Import data</button>
            <button type="button" role="menuitem" id="settings-save-template">Save template…</button>
            <div id="settings-templates" class="settings-templates" role="group" aria-label="Templates"></div>
          </div>
        </div>
        <input type="file" id="backup-file" accept="application/json,.json" hidden />
        <span id="live-status" class="live-status" data-live="off" title="Public Kraken WebSocket (OHLC and ticker)">Offline</span>
        <div id="interval-hint" class="interval-hint" hidden></div>
        <div id="status" class="status" role="status">Loading…</div>
      </header>

        <div class="workspace-body">
        <nav id="tool-rail" aria-label="Drawing tools"></nav>
        <div id="rail-flyout" hidden role="menu" aria-label="Tool menu"></div>
      <div id="charts" data-panes="1">
        <div id="chart-wrap">
          <div id="chart"></div>
          <div id="compare-legend" class="compare-legend" hidden></div>
          <canvas id="draw-overlay" class="passthrough"></canvas>
          <canvas id="vp-overlay"></canvas>
          <div id="ohlc-legend" hidden></div>
          <div id="ind-labels"></div>
          <div id="chart-loader" hidden>
            <div class="chart-skeleton" aria-hidden="true"></div>
            <div class="chart-spinner" role="status" aria-label="Loading chart"></div>
          </div>
          <div id="cursor-dot" hidden></div>
          <div id="draw-bar" hidden>
            <input type="color" id="draw-color" title="Color" aria-label="Line color" value="#5b9cf6" />
            <select id="draw-width" title="Width" aria-label="Line width">
              <option value="1">1 px</option>
              <option value="2">2 px</option>
              <option value="3">3 px</option>
              <option value="4">4 px</option>
            </select>
            <select id="draw-linestyle" title="Line style" aria-label="Line style">
              <option value="solid">Solid</option>
              <option value="dashed">Dashed</option>
              <option value="dotted">Dotted</option>
            </select>
            <button type="button" id="draw-settings" title="Settings" aria-label="Settings" hidden>
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M6.5 1.2h3l.35 1.7c.42.16.81.39 1.16.67l1.65-.7 1.5 2.6-1.35 1.15c.08.4.12.8.12 1.22s-.04.82-.12 1.22l1.35 1.15-1.5 2.6-1.65-.7a5.3 5.3 0 0 1-1.16.67L9.5 14.8h-3l-.35-1.7a5.3 5.3 0 0 1-1.16-.67l-1.65.7-1.5-2.6 1.35-1.15A5.4 5.4 0 0 1 3 8.94c0-.42.04-.82.12-1.22L1.77 6.57l1.5-2.6 1.65.7c.35-.28.74-.51 1.16-.67L6.5 1.2ZM8 6.4A1.6 1.6 0 1 0 8 9.6 1.6 1.6 0 0 0 8 6.4Z"/></svg>
            </button>
            <button type="button" id="draw-lock" title="Lock">Lock</button>
            <button type="button" id="draw-delete" title="Delete">Delete</button>
          </div>
            <div id="fav-bar" hidden></div>
        </div>
        <div class="chart-cell extra-cell" data-extra="0"></div>
        <div class="chart-cell extra-cell" data-extra="1"></div>
        <div class="chart-cell extra-cell" data-extra="2"></div>
      </div>
        </div>
      </div>
      <div id="sidebar">
        <aside id="watchlist" aria-label="Watchlists"></aside>
        <aside id="alerts-panel" aria-label="Price alerts">
          <h2>Price alerts</h2>
          <p class="alert-note">Alerts work while this tab is open</p>
          <form id="alert-form" class="alert-form">
            <select id="alert-dir" aria-label="Direction">
              <option value="above">Price ≥</option>
              <option value="below">Price ≤</option>
            </select>
            <input type="number" id="alert-price" step="any" min="0" required placeholder="Level" />
            <button type="submit">Add</button>
          </form>
          <button type="button" id="alert-notify-btn" class="alert-notify-btn">Enable notifications</button>
          <div id="alert-list" class="alert-list"></div>
        </aside>
      </div>
      <div id="sym-modal" hidden>
        <div class="sym-modal-backdrop"></div>
        <div class="sym-modal-box" role="dialog" aria-modal="true" aria-labelledby="sym-modal-title">
          <div class="ind-modal-head">
            <h2 id="sym-modal-title">Search symbol</h2>
            <button type="button" id="sym-modal-close" aria-label="Close">×</button>
          </div>
          <input id="sym-search" type="search" placeholder="Name or ticker, e.g. sol or aapl" autocomplete="off" />
          <div class="sym-filter-rows">
            <div id="sym-cats" class="sym-filters" role="group" aria-label="Asset type">
              <button type="button" data-sym-cat="all" class="is-active">All</button>
              <button type="button" data-sym-cat="crypto">Crypto</button>
              <button type="button" data-sym-cat="stocks">Stocks</button>
            </div>
            <div id="sym-filters" class="sym-filters" role="group" aria-label="Exchange">
              <button type="button" data-sym-filter="all" class="is-active">All</button>
              <button type="button" data-sym-filter="kraken">Kraken</button>
              <button type="button" data-sym-filter="binance">Binance</button>
              <button type="button" data-sym-filter="coinbase">Coinbase</button>
              <button type="button" data-sym-filter="bitstamp">Bitstamp</button>
              <button type="button" data-sym-filter="yahoo">Yahoo</button>
            </div>
          </div>
          <div id="sym-results" class="sym-results"></div>
        </div>
      </div>
      <div id="ind-modal" hidden>
        <div class="ind-modal-backdrop"></div>
        <div class="ind-modal-box" role="dialog" aria-modal="true" aria-labelledby="ind-modal-title">
          <div class="ind-modal-head">
            <h2 id="ind-modal-title">Indicators</h2>
            <button type="button" id="ind-modal-close" aria-label="Close">×</button>
          </div>
          <input id="ind-search" type="search" placeholder="Search indicator" autocomplete="off" />
          <div id="ind-catalog"></div>
        </div>
      </div>
    </div>
    <input type="file" id="import-file" accept="application/json,.json" hidden />
    <div id="chart-menu" hidden role="menu" aria-label="Chart menu">
      <button type="button" role="menuitem" data-chart-menu="reset">Reset chart</button>
      <button type="button" role="menuitem" data-chart-menu="copy-price">Copy price</button>
      <button type="button" role="menuitem" data-chart-menu="add-alert">Add alert</button>
      <button type="button" role="menuitem" data-chart-menu="watchlist">Add symbol to watchlist</button>
      <button type="button" role="menuitem" data-chart-menu="clear-drawings">Remove all drawings</button>
      <button type="button" role="menuitem" data-chart-menu="export">Export drawings</button>
      <button type="button" role="menuitem" data-chart-menu="import">Import drawings</button>
      <button type="button" role="menuitem" data-chart-menu="settings" hidden>Settings…</button>
      <button type="button" role="menuitem" data-chart-menu="extend">Extend Fib right</button>
    </div>
    <div id="fib-modal" hidden>
      <div class="fib-modal-backdrop"></div>
      <div class="fib-modal-box" role="dialog" aria-modal="true" aria-labelledby="fib-modal-title" tabindex="-1">
        <div class="ind-modal-head">
          <h2 id="fib-modal-title">Fib Retracement</h2>
          <button type="button" id="fib-modal-close" aria-label="Close">×</button>
        </div>
        <div class="fib-tabs" role="tablist">
          <button type="button" class="is-active" data-fib-tab="style" role="tab" aria-selected="true">Style</button>
        </div>
        <div id="fib-style" class="fib-tab-body">
          <div id="fib-levels" class="fib-levels"></div>
          <div class="fib-level-actions">
            <button type="button" id="fib-add-level">Add level</button>
          </div>
          <label class="fib-row"><input type="checkbox" id="fib-bg" /> Background
            <input type="range" id="fib-bg-opacity" min="2" max="40" value="8" />
            <span id="fib-bg-opacity-val">8%</span>
          </label>
          <label class="fib-row"><input type="checkbox" id="fib-reverse" /> Reverse</label>
          <label class="fib-row"><input type="checkbox" id="fib-prices" /> Prices</label>
          <label class="fib-row"><input type="checkbox" id="fib-show-levels" /> Levels</label>
          <label class="fib-row">Labels
            <select id="fib-labels">
              <option value="left">Left</option>
              <option value="right">Right</option>
            </select>
            <select id="fib-label-valign" aria-label="Label vertical position">
              <option value="top">Top</option>
              <option value="middle">Middle</option>
              <option value="bottom">Bottom</option>
            </select>
          </label>
          <label class="fib-row"><input type="checkbox" id="fib-trend" /> Trend line
            <select id="fib-trend-style" aria-label="Trend line style">
              <option value="solid">Solid</option>
              <option value="dashed">Dashed</option>
              <option value="dotted">Dotted</option>
            </select>
          </label>
          <label class="fib-row"><input type="checkbox" id="fib-extend" /> Extend lines</label>
        </div>
        <div class="fib-modal-foot">
          <button type="button" id="fib-reset">Reset to defaults</button>
          <button type="button" id="fib-save-default">Save as default</button>
          <span id="fib-saved-note" class="fib-saved-note"></span>
          <span class="fib-foot-spacer"></span>
          <button type="button" id="fib-cancel">Cancel</button>
          <button type="button" id="fib-ok">OK</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
      <div id="backup-modal" hidden>
      <div class="fib-modal-backdrop"></div>
      <div class="fib-modal-box" role="dialog" aria-modal="true" aria-labelledby="backup-modal-title" tabindex="-1">
        <div class="ind-modal-head">
          <h2 id="backup-modal-title">Import data</h2>
          <button type="button" id="backup-cancel" aria-label="Cancel">×</button>
        </div>
        <p>Replace all current OpenCharts settings, or merge only the keys from this file?</p>
        <div class="backup-actions">
          <button type="button" id="backup-replace">Replace all</button>
          <button type="button" id="backup-merge">Merge</button>
        </div>
      </div>
    </div>
</body>
</html>
