<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wykresy</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="sidebar">
      <aside id="watchlist" aria-label="Listy obserwowanych"></aside>
      <aside id="alerts-panel" aria-label="Alerty cenowe">
        <h2>Alerty cenowe</h2>
        <form id="alert-form" class="alert-form">
          <select id="alert-dir" aria-label="Kierunek">
            <option value="above">Cena ≥</option>
            <option value="below">Cena ≤</option>
          </select>
          <input type="number" id="alert-price" step="any" min="0" required placeholder="Poziom" />
          <button type="submit">Dodaj</button>
        </form>
        <div id="alert-list" class="alert-list"></div>
      </aside>
      </div>
      <div id="alert-toast" class="alert-toast" hidden role="status"></div>
      <div id="workspace">
      <header class="toolbar">
        <div class="brand" title="Wykresy">Wykresy</div>

        <label class="field">
          <span>Giełda</span>
          <select id="source" data-source></select>
        </label>

        <label class="field">
          <span>Para</span>
          <select id="pair" data-pair></select>
        </label>

        <div class="group" role="group" aria-label="Interwał" id="intervals"></div>

        <div class="sep"></div>

        <div class="group" role="group" aria-label="Narzędzia rysowania">
          <button type="button" class="tool is-active" data-tool="cursor" title="Kursor (przesuwanie wykresu)">Kursor</button>
          <button type="button" class="tool" data-tool="trend" title="Linia trendu — dwa kliknięcia">Linia trendu</button>
          <button type="button" class="tool" data-tool="hline" title="Linia pozioma — jedno kliknięcie">Linia pozioma</button>
          <button type="button" class="tool" data-tool="rect" title="Prostokąt — dwa kliknięcia">Prostokąt</button>
          <button type="button" class="tool" data-tool="ray" title="Promień — dwa kliknięcia, przedłużany">Promień</button>
          <button type="button" class="tool" data-tool="channel" title="Kanał równoległy — trzy kliknięcia">Kanał</button>
          <button type="button" class="tool" data-tool="fib" title="Zniesienie Fibonacciego — dwa kliknięcia">Fibo</button>
          <button type="button" class="tool" data-tool="fibext" title="Fibo rozszerzenie wg trendu — trzy punkty A, B, C">Fibo rozszerzenie</button>
          <button type="button" class="tool" data-tool="abcd" title="Korekta 1:1 (AB=CD) — trzy punkty A, B, C">AB=CD</button>
          <button type="button" class="tool" data-tool="text" title="Tekst — kliknij i wpisz">Tekst</button>
        </div>

        <div class="group">
          <button type="button" id="delete-btn" title="Usuń zaznaczony rysunek (Delete)">Usuń</button>
          <button type="button" id="clear-btn" class="danger" title="Usuń wszystkie rysunki tej pary">Wyczyść wszystko</button>
          <button type="button" id="export-btn" title="Eksport rysunków do JSON">Eksport</button>
          <button type="button" id="import-btn" title="Import rysunków z JSON">Import</button>
          <input type="file" id="import-file" accept="application/json,.json" hidden />
          <button type="button" id="extend-right-btn" title="Przedłuż poziomy Fibo rozszerzenia w prawo">Przedłuż w prawo</button>
        </div>

        <button type="button" id="theme-btn" title="Przełącz motyw jasny/ciemny">Motyw jasny</button>
        <span id="live-status" class="live-status" data-live="off" title="Publiczny WebSocket Krakena (OHLC i ticker)">Offline</span>
        <div id="status" class="status" role="status">Ładowanie…</div>
      </header>

      <div class="toolbar indicators-bar" id="indicators-bar">
        <span class="muted-label">Wskaźniki</span>
        <label class="ind"><input type="checkbox" data-ind="sma" /> SMA <input type="number" data-ind-period="sma" min="2" max="400" value="20" title="Okres SMA" /></label>
        <label class="ind"><input type="checkbox" data-ind="wma" /> WMA <input type="number" data-ind-period="wma" min="2" max="400" value="20" title="Okres WMA" /></label>
        <label class="ind"><input type="checkbox" data-ind="ema" /> EMA <input type="number" data-ind-period="ema" min="2" max="400" value="20" title="Okres EMA" /></label>
        <label class="ind"><input type="checkbox" data-ind="bb" /> Bollinger <input type="number" data-ind-period="bb" min="2" max="400" value="20" title="Okres Bollinger" /> <input type="number" data-ind-std="bb" min="0.5" max="6" step="0.1" value="2" title="Odchylenie std." /></label>
        <label class="ind"><input type="checkbox" data-ind="volume" checked /> Wolumen</label>
        <label class="ind"><input type="checkbox" data-ind="vwap" /> VWAP</label>
        <label class="ind"><input type="checkbox" data-ind="stoch" /> Stochastic <input type="number" data-ind-stoch="k" min="2" max="400" value="14" title="Stochastic %K" /> <input type="number" data-ind-stoch="d" min="1" max="100" value="3" title="Stochastic %D" /></label>
        <label class="ind"><input type="checkbox" data-ind="rsi" /> RSI <input type="number" data-ind-period="rsi" min="2" max="400" value="14" title="Okres RSI" /></label>
        <label class="ind"><input type="checkbox" data-ind="pivots" /> Pivot Points</label>
        <label class="ind"><input type="checkbox" data-ind="ichimoku" /> Ichimoku</label>
        <label class="ind"><input type="checkbox" data-ind="supertrend" /> Supertrend <input type="number" data-ind-st="period" min="2" max="400" value="10" title="Okres ATR Supertrend" /> <input type="number" data-ind-st="mult" min="0.5" max="10" step="0.1" value="3" title="Mnożnik Supertrend" /></label>
        <label class="ind"><input type="checkbox" data-ind="adx" /> ADX/DMI <input type="number" data-ind-period="adx" min="2" max="400" value="14" title="Okres ADX" /></label>
        <label class="ind"><input type="checkbox" data-ind="atr" /> ATR <input type="number" data-ind-period="atr" min="2" max="400" value="14" title="Okres ATR" /></label>
        <label class="ind"><input type="checkbox" data-ind="macd" /> MACD
          <input type="number" data-ind-macd="fast" min="2" max="200" value="12" title="MACD szybka" />
          <input type="number" data-ind-macd="slow" min="3" max="400" value="26" title="MACD wolna" />
          <input type="number" data-ind-macd="signal" min="2" max="200" value="9" title="MACD sygnał" />
        </label>
      </div>

      <div id="chart-wrap">
        <div id="chart"></div>
        <canvas id="draw-overlay" class="passthrough"></canvas>
      </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
